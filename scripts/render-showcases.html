<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>RustOwl native Zed hover preview</title>
    <style>
      :root {
        color-scheme: dark;
        --editor: #111317;
        --editor-line: #161a21;
        --foreground: #d8dce5;
        --muted: #626875;
        --popover: #25262b;
        --popover-border: #3b3d45;
        --green: #52d65b;
        --blue: #647cf3;
        --purple: #d65bd1;
        --orange: #d69852;
        --red: #d65252;
      }

      * { box-sizing: border-box; }

      html,
      body {
        width: 1400px;
        height: 600px;
        margin: 0;
        overflow: hidden;
      }

      body {
        display: grid;
        place-items: center;
        background: #0b0d10;
      }

      .editor {
        position: relative;
        width: 1360px;
        height: 560px;
        overflow: hidden;
        border: 1px solid #2a2d34;
        border-radius: 10px;
        background: var(--editor);
        box-shadow: 0 20px 55px rgba(0, 0, 0, 0.42);
      }

      .code {
        position: absolute;
        left: 0;
        top: var(--code-top);
        width: 940px;
        padding: 12px 0;
      }

      .line {
        min-height: 46px;
        display: grid;
        grid-template-columns: 66px 1fr;
        align-items: center;
        padding-right: 26px;
        white-space: pre;
        font: 22px/1.55 ui-monospace, SFMono-Regular, Menlo, Monaco, monospace;
      }

      .line.focus {
        background: var(--editor-line);
      }

      .number {
        padding-right: 20px;
        color: #555b67;
        font-size: 14px;
        text-align: right;
        user-select: none;
      }

      .source { color: var(--foreground); }
      .kw { color: #c792ea; }
      .fn { color: #82aaff; }
      .type { color: #ffcb6b; }
      .str { color: #c3e88d; }
      .macro { color: #89ddff; }
      .num { color: #f78c6c; }
      .mut { color: #f78c6c; }
      .life { color: #a7e06f; font-style: italic; }

      .u-green,
      .u-blue,
      .u-purple,
      .u-orange,
      .u-red {
        padding-bottom: 2px;
        border-bottom: 3px solid;
      }

      .u-green { border-color: var(--green); }
      .u-blue { border-color: var(--blue); }
      .u-purple { border-color: var(--purple); }
      .u-orange { border-color: var(--orange); }
      .u-red { border-color: var(--red); }

      .hint {
        margin-left: 15px;
        color: #777e8d;
        font-size: 15px;
        font-style: italic;
        vertical-align: 1px;
      }

      .popover {
        position: absolute;
        z-index: 2;
        top: var(--popover-top);
        right: 34px;
        width: 376px;
        padding: 12px;
        border: 1px solid var(--popover-border);
        border-radius: 8px;
        background: var(--popover);
        color: #d7d9df;
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.44);
        font: 14px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .popover p {
        margin: 0 0 10px;
      }

      .popover p:last-child {
        margin-bottom: 0;
      }

      .popover strong {
        color: #f1f2f4;
        font-weight: 700;
      }

      .popover code {
        padding: 2px 5px;
        border-radius: 4px;
        background: #17191e;
        color: #d8dbe2;
        font: 12px ui-monospace, SFMono-Regular, Menlo, Monaco, monospace;
      }
    </style>
  </head>
  <body>
    <main id="editor" class="editor">
      <section id="code" class="code"></section>
      <aside id="popover" class="popover">
        <p><strong>RustOwl</strong></p>
        <p id="hover-message"></p>
        <p>Analysis status: <code>finished</code></p>
      </aside>
    </main>

    <script>
      const scenes = {
        borrow: {
          codeTop: "142px",
          popoverTop: "168px",
          focus: 3,
          hover: "immutable borrow",
          lines: [
            `<span class="kw">fn</span> <span class="fn">greet</span>() {`,
            `    <span class="kw">let</span> <span class="u-green">message</span> = <span class="type">String</span>::<span class="fn">from</span>(<span class="str">"hello, Rust"</span>);`,
            `    <span class="kw">let</span> borrowed = <span class="u-blue">&amp;message</span>;<span class="hint">← immutable borrow</span>`,
            `    <span class="macro">println!</span>(<span class="str">"{borrowed}"</span>);`,
            `}`
          ]
        },
        move: {
          codeTop: "58px",
          popoverTop: "242px",
          focus: 7,
          hover: "variable moved",
          lines: [
            `<span class="kw">fn</span> <span class="fn">send</span>(payload: <span class="type">String</span>) {`,
            `    <span class="fn">drop</span>(payload);`,
            `}`,
            ``,
            `<span class="kw">fn</span> <span class="fn">main</span>() {`,
            `    <span class="kw">let</span> <span class="u-green">payload</span> = <span class="type">String</span>::<span class="fn">from</span>(<span class="str">"signed token"</span>);`,
            `    <span class="fn">send</span>(<span class="u-orange">payload</span>);<span class="hint">← moved</span>`,
            `    <span class="macro">println!</span>(<span class="str">"{</span><span class="u-red">payload</span><span class="str">}"</span>);`,
            `}`
          ]
        },
        conflict: {
          codeTop: "118px",
          popoverTop: "210px",
          focus: 4,
          hover: "immutable and mutable borrows of scores exist here",
          lines: [
            `<span class="kw">fn</span> <span class="fn">adjust</span>() {`,
            `    <span class="kw">let</span> <span class="mut">mut</span> scores = <span class="macro">vec!</span>[<span class="num">10</span>, <span class="num">20</span>, <span class="num">30</span>];`,
            `    <span class="kw">let</span> first = <span class="u-purple">&amp;mut scores[0]</span>;<span class="hint">← mutable borrow</span>`,
            `    <span class="kw">let</span> second = <span class="u-red">&amp;scores[1]</span>;<span class="hint">← conflicting borrows</span>`,
            `    *first += *second;`,
            `}`
          ]
        },
        lifetime: {
          codeTop: "36px",
          popoverTop: "210px",
          focus: 6,
          hover: "left definitely lives here",
          lines: [
            `<span class="kw">fn</span> <span class="fn">longest</span>&lt;<span class="u-green life">'a</span>&gt;(`,
            `    left: &amp;<span class="u-green life">'a</span> <span class="type">str</span>,`,
            `    right: &amp;<span class="u-green life">'a</span> <span class="type">str</span>,`,
            `) -&gt; &amp;<span class="u-green life">'a</span> <span class="type">str</span> {`,
            `    <span class="kw">if</span> left.<span class="fn">len</span>() &gt; right.<span class="fn">len</span>() {`,
            `        <span class="u-green">left</span>`,
            `    } <span class="kw">else</span> {`,
            `        <span class="u-green">right</span>`,
            `    }`,
            `}`
          ]
        }
      };

      const key = new URLSearchParams(location.search).get("scene") || "borrow";
      const scene = scenes[key] || scenes.borrow;
      const editor = document.getElementById("editor");
      editor.style.setProperty("--code-top", scene.codeTop);
      editor.style.setProperty("--popover-top", scene.popoverTop);
      document.getElementById("hover-message").textContent = scene.hover;
      document.getElementById("code").innerHTML = scene.lines
        .map((source, index) => `<div class="line ${index + 1 === scene.focus ? "focus" : ""}"><span class="number">${index + 1}</span><span class="source">${source || "&nbsp;"}</span></div>`)
        .join("");
    </script>
  </body>
</html>
