<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>RustOwl native Zed hover preview</title>
    <style>
      :root {
        color-scheme: dark;
        --editor: #1d2021;
        --editor-line: #282828;
        --foreground: #ebdbb2;
        --muted: #928374;
        --popover: #3c3836;
        --popover-border: #504945;
        --green: #b8bb26;
        --blue: #83a598;
        --purple: #d3869b;
        --orange: #fe8019;
        --red: #fb4934;
      }

      * { box-sizing: border-box; }

      html,
      body {
        width: 1400px;
        height: 600px;
        margin: 0;
        overflow: hidden;
      }

      body {
        display: grid;
        place-items: center;
        background: #141617;
      }

      .editor {
        position: relative;
        width: 1360px;
        height: 560px;
        overflow: hidden;
        border: 1px solid #3c3836;
        border-radius: 10px;
        background: var(--editor);
        box-shadow: 0 20px 55px rgba(0, 0, 0, 0.42);
      }

      .code {
        position: absolute;
        left: 0;
        top: var(--code-top);
        width: 940px;
        padding: 12px 0;
      }

      .line {
        min-height: 46px;
        display: grid;
        grid-template-columns: 66px 1fr;
        align-items: center;
        padding-right: 26px;
        white-space: pre;
        font: 22px/1.55 ui-monospace, SFMono-Regular, Menlo, Monaco, monospace;
      }

      .line.focus {
        background: var(--editor-line);
      }

      .number {
        padding-right: 20px;
        color: #665c54;
        font-size: 14px;
        text-align: right;
        user-select: none;
      }

      .source { color: var(--foreground); }
      .kw { color: #d3869b; }
      .fn { color: #83a598; }
      .type { color: #fabd2f; }
      .str { color: #b8bb26; }
      .macro { color: #8ec07c; }
      .num { color: #fe8019; }
      .mut { color: #fb4934; }
      .life { color: #b8bb26; font-style: italic; }

      .u-green,
      .u-blue,
      .u-purple,
      .u-orange,
      .u-red {
        padding-bottom: 2px;
        border-bottom: 3px solid;
      }

      .u-green { border-color: var(--green); }
      .u-blue { border-color: var(--blue); }
      .u-purple { border-color: var(--purple); }
      .u-orange { border-color: var(--orange); }
      .u-red { border-color: var(--red); }

      .hint {
        margin-left: 15px;
        color: #928374;
        font-size: 15px;
        font-style: italic;
        vertical-align: 1px;
      }

      .popover {
        position: absolute;
        z-index: 2;
        top: var(--popover-top);
        right: 34px;
        width: 460px;
        padding: 14px 16px;
        border: 1px solid var(--popover-border);
        border-radius: 8px;
        background: var(--popover);
        color: #d5c4a1;
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.44);
        font: 13px/1.48 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .popover h3 {
        margin: 0 0 8px;
        color: #fbf1c7;
        font-size: 16px;
        line-height: 1.3;
      }

      .popover h3 span {
        color: #928374;
        font-weight: 400;
      }

      .popover h4 {
        margin: 0 0 7px;
        color: #ebdbb2;
        font-size: 13px;
      }

      .popover p {
        margin: 0;
      }

      .summary {
        color: #d5c4a1;
      }

      .detail {
        margin-top: 10px !important;
        color: #d5c4a1;
      }

      .divider {
        height: 1px;
        margin: 11px 0;
        border: 0;
        background: #504945;
      }

      .analysis {
        color: #bdae93;
        font-size: 12px;
      }

      .popover strong {
        color: #fbf1c7;
        font-weight: 700;
      }

      .popover code {
        padding: 2px 5px;
        border-radius: 4px;
        background: #282828;
        color: #ebdbb2;
        font: 12px ui-monospace, SFMono-Regular, Menlo, Monaco, monospace;
      }
    </style>
  </head>
  <body>
    <main id="editor" class="editor">
      <section id="code" class="code"></section>
      <aside id="popover" class="popover"></aside>
    </main>

    <script>
      const scenes = {
        borrow: {
          codeTop: "142px",
          popoverTop: "74px",
          focus: 3,
          title: "Shared borrow",
          summary: "<code>borrowed</code> can read <code>message</code> without taking ownership. <code>message</code> remains the owner.",
          why: "<code>message</code> cannot be mutably borrowed until <code>borrowed</code>'s final use.",
          flow: "<code>message</code> ── shared view ─→ <code>borrowed</code>",
          status: "Verified by rustc against the current source.",
          lines: [
            `<span class="kw">fn</span> <span class="fn">greet</span>() {`,
            `    <span class="kw">let</span> <span class="u-green">message</span> = <span class="type">String</span>::<span class="fn">from</span>(<span class="str">"hello, Rust"</span>);`,
            `    <span class="kw">let</span> borrowed = <span class="u-blue">&amp;message</span>;<span class="hint">← shared borrow · read-only</span>`,
            `    <span class="macro">println!</span>(<span class="str">"{borrowed}"</span>);`,
            `}`
          ]
        },
        move: {
          codeTop: "58px",
          popoverTop: "82px",
          focus: 7,
          title: "Ownership moved",
          summary: "Calling <code>send(payload)</code> moves <code>payload</code> into the <code>value</code> parameter of <code>send</code>. <code>payload</code> cannot be used again after this line.",
          actionLabel: "Keep using <code>payload</code>",
          why: "pass <code>&amp;payload</code> if the function only needs to read it, or use <code>payload.clone()</code> when a deliberate duplicate is appropriate.",
          flow: "caller: <code>payload</code> → <code>send</code> → callee: <code>value</code>",
          status: "Verified by rustc against the current source.",
          lines: [
            `<span class="kw">fn</span> <span class="fn">send</span>(value: <span class="type">String</span>) {`,
            `    <span class="fn">drop</span>(value);`,
            `}`,
            ``,
            `<span class="kw">fn</span> <span class="fn">main</span>() {`,
            `    <span class="kw">let</span> <span class="u-green">payload</span> = <span class="type">String</span>::<span class="fn">from</span>(<span class="str">"signed token"</span>);`,
            `    <span class="fn">send</span>(<span class="u-orange">payload</span>);<span class="hint">← move / call · check ownership</span>`,
            `    <span class="macro">println!</span>(<span class="str">"{</span><span class="u-red">payload</span><span class="str">}"</span>);`,
            `}`
          ]
        },
        conflict: {
          codeTop: "118px",
          popoverTop: "66px",
          focus: 4,
          title: "Borrow conflict",
          summary: "The exclusive view <code>first</code> and shared view <code>second</code> overlap on <code>scores</code>.",
          why: "Rust rejects competing access. End the earlier borrow, shorten its scope, or reorder the operations.",
          flow: "<code>scores</code> → <code>first: &amp;mut</code> ✕ <code>second: &amp;</code>",
          status: "Verified by rustc against the current source.",
          lines: [
            `<span class="kw">fn</span> <span class="fn">adjust</span>() {`,
            `    <span class="kw">let</span> <span class="mut">mut</span> scores = <span class="macro">vec!</span>[<span class="num">10</span>, <span class="num">20</span>, <span class="num">30</span>];`,
            `    <span class="kw">let</span> first = <span class="u-purple">&amp;mut scores[0]</span>;<span class="hint">← exclusive borrow · writable</span>`,
            `    <span class="kw">let</span> second = <span class="u-red">&amp;scores[1]</span>;<span class="hint">← borrow conflict · shared + mutable</span>`,
            `    *first += *second;`,
            `}`
          ]
        },
        lifetime: {
          codeTop: "36px",
          popoverTop: "70px",
          focus: 6,
          title: "Definitely live",
          summary: "The compiler sees <code>left</code> initialized on every path that reaches this expression.",
          why: "This proves availability here; active borrows may still restrict how the value can be used.",
          flow: "parameter <code>left</code> → selected return value → caller",
          status: "Verified by rustc against the current source.",
          lines: [
            `<span class="kw">fn</span> <span class="fn">longest</span>&lt;<span class="u-green life">'a</span>&gt;(`,
            `    left: &amp;<span class="u-green life">'a</span> <span class="type">str</span>,`,
            `    right: &amp;<span class="u-green life">'a</span> <span class="type">str</span>,`,
            `) -&gt; &amp;<span class="u-green life">'a</span> <span class="type">str</span> {`,
            `    <span class="kw">if</span> left.<span class="fn">len</span>() &gt; right.<span class="fn">len</span>() {`,
            `        <span class="u-green">left</span>`,
            `    } <span class="kw">else</span> {`,
            `        <span class="u-green">right</span>`,
            `    }`,
            `}`
          ]
        }
      };

      const key = new URLSearchParams(location.search).get("scene") || "borrow";
      const scene = scenes[key] || scenes.borrow;
      const editor = document.getElementById("editor");
      editor.style.setProperty("--code-top", scene.codeTop);
      editor.style.setProperty("--popover-top", scene.popoverTop);
      document.getElementById("popover").innerHTML = `
        <h3>RustOwl <span>·</span> ${scene.title}</h3>
        <p class="summary">${scene.summary}</p>
        <p class="detail"><strong>${scene.actionLabel || "Why it matters"}</strong> · ${scene.why}</p>
        <p class="detail"><strong>Flow</strong> · ${scene.flow}</p>
        <hr class="divider">
        <p class="analysis">${scene.status}</p>`;
      document.getElementById("code").innerHTML = scene.lines
        .map((source, index) => `<div class="line ${index + 1 === scene.focus ? "focus" : ""}"><span class="number">${index + 1}</span><span class="source">${source || "&nbsp;"}</span></div>`)
        .join("");
    </script>
  </body>
</html>
