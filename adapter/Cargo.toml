[package]
name = "rustowl-zed-adapter"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Translate RustOwl's custom LSP protocol for Zed"
repository = "https://github.com/rusty-auth/rustowl-zed"
publish = false

[dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.47", features = [
  "io-std",
  "io-util",
  "macros",
  "process",
  "rt-multi-thread",
  "sync",
] }
url = "2.5"
