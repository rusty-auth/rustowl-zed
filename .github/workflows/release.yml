name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            archive: tar
            engine_profile: release
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive: tar
            engine_profile: release
          - os: macos-15-intel
            target: x86_64-apple-darwin
            archive: tar
            engine_profile: release
          - os: macos-15
            target: aarch64-apple-darwin
            archive: tar
            engine_profile: release
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
            engine_profile: windows-release
          - os: windows-11-vs2026-arm
            target: aarch64-pc-windows-msvc
            archive: zip
            engine_profile: windows-release
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Initialize production and licence submodules
        shell: bash
        run: git submodule update --init --depth 1 engine references/helix-db
      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}
      - name: Build adapter
        run: >-
          cargo build --locked --release --manifest-path adapter/Cargo.toml
          --target ${{ matrix.target }}
      - name: Build compiler engine and MCP server
        working-directory: engine
        # rustc-private binaries cannot use fat LTO on Windows. RustOwl's
        # windows-release profile inherits release while disabling LTO.
        run: cargo build --locked --profile ${{ matrix.engine_profile }} --bins
      - name: Generate CycloneDX software bill of materials
        shell: bash
        run: |
          mkdir staging
          node scripts/generate-sbom.mjs staging/sbom.cdx.json
      - name: Package unified runtime (Unix)
        if: matrix.archive == 'tar'
        shell: bash
        run: |
          cp "adapter/target/${{ matrix.target }}/release/rustowl-zed-adapter" staging/
          cp engine/target/${{ matrix.engine_profile }}/rustowl staging/
          cp engine/target/${{ matrix.engine_profile }}/rustowlc staging/
          cp engine/target/${{ matrix.engine_profile }}/rustowl-mcp staging/
          cp LICENSE staging/LICENSE-MIT
          cp engine/LICENSE staging/LICENSE-MPL-2.0
          cp references/helix-db/LICENSE staging/LICENSE-APACHE-2.0
          cp THIRD_PARTY_NOTICES.md staging/
          cp engine/THIRD_PARTY_NOTICES.md staging/ENGINE_THIRD_PARTY_NOTICES.md
          cp runtime/manifest.json staging/
          (cd staging && shasum -a 256 rustowl-zed-adapter rustowl rustowlc rustowl-mcp manifest.json sbom.cdx.json LICENSE-MIT LICENSE-MPL-2.0 LICENSE-APACHE-2.0 THIRD_PARTY_NOTICES.md ENGINE_THIRD_PARTY_NOTICES.md > checksums.sha256)
          tar -C staging -czf "rustowl-zed-runtime-${{ matrix.target }}.tar.gz" .
      - name: Package unified runtime (Windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          Copy-Item "adapter/target/${{ matrix.target }}/release/rustowl-zed-adapter.exe" staging/
          Copy-Item engine/target/${{ matrix.engine_profile }}/rustowl.exe staging/
          Copy-Item engine/target/${{ matrix.engine_profile }}/rustowlc.exe staging/
          Copy-Item engine/target/${{ matrix.engine_profile }}/rustowl-mcp.exe staging/
          Copy-Item LICENSE staging/LICENSE-MIT
          Copy-Item engine/LICENSE staging/LICENSE-MPL-2.0
          Copy-Item references/helix-db/LICENSE staging/LICENSE-APACHE-2.0
          Copy-Item THIRD_PARTY_NOTICES.md staging/
          Copy-Item engine/THIRD_PARTY_NOTICES.md staging/ENGINE_THIRD_PARTY_NOTICES.md
          Copy-Item runtime/manifest.json staging/
          $checksumLines = Get-ChildItem staging/* -File | Where-Object { $_.Name -ne "checksums.sha256" } | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)"
          }
          # Keep checksum manifests portable across Windows, macOS, and Linux.
          # Add-Content uses platform newlines, which makes the trailing CR part
          # of each filename when shasum verifies the archive on Unix.
          $checksumPath = Join-Path $PWD "staging/checksums.sha256"
          [System.IO.File]::WriteAllText(
            $checksumPath,
            ($checksumLines -join "`n") + "`n",
            [System.Text.UTF8Encoding]::new($false)
          )
          Compress-Archive -Path staging/* -DestinationPath "rustowl-zed-runtime-${{ matrix.target }}.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: rustowl-zed-runtime-${{ matrix.target }}
          path: rustowl-zed-runtime-${{ matrix.target }}.*
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}" artifacts/*
          --repo "${GITHUB_REPOSITORY}"
          --generate-notes
          --verify-tag
